<style>
.t0,.t1,.t2,.t3{animation:tw 4s ease-in-out infinite}
.t1{animation-delay:-1s}.t2{animation-delay:-2s}.t3{animation-delay:-3s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.rise{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.star{animation:star 7s linear infinite;offset-rotate:0deg}
.s2{animation-delay:-3.5s}
@keyframes star{0%{transform:translate(0,0);opacity:0}4%{opacity:1}18%{opacity:0;transform:translate(420px,150px)}100%{opacity:0;transform:translate(420px,150px)}}
@media (prefers-reduced-motion:reduce){.t0,.t1,.t2,.t3,.glow,.star{animation:none}.rise{animation:none;opacity:1}}
</style>
